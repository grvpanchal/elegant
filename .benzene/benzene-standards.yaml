    scale:
      cells: 1
      reason: one plan, one voice
    every: 1
    bars:
    - name: roadmap-90-days
      statement: ROADMAP.md is a table of item | status | owner | target (YYYY-MM) with at least 6 planned or in-progress
        items, one owner office per row, and a furthest target month that starts at least 60 days out (a horizon of about
        90 days).
      target: '>= 6 unshipped items; furthest target >= 90 days out (month start >= today + 60 d); 1 owner office per row'
      competitors:
        GreatFrontEnd: public /interviews/roadmap; JS batches every 2 weeks to 2027-04-25
        Master.dev (Frontend Masters): 8 live workshops scheduled up to 173 days ahead
        Linear: a single lead per project; target dates at month precision
