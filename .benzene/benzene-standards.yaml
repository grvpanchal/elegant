        cwd: .
        timeout_s: 900
    - name: sprint-within-capacity
      statement: The board's sprint ledger (.benzene/board/sprint.json) names a current sprint, and no office has more steps
        planned in it than its capacity.
      target: a current sprint exists; planned steps <= capacity for every office
      competitors:
        Linear: capacity = velocity of the last 3 completed cycles; 'Don't overload cycles'; 2-week cycles most common
      sources:
      - https://linear.app/docs/use-cycles
      - https://linear.app/method/introduction
      when: heal
