# The researched standard for the elegant organisation, written from standards/<office>.md (2026-10-17).
# Every bar: what the competition does, the target, who set it, the source, and the check that holds the office to it.
purpose: 'Build the best Frontend AI Harness training site: every lesson a frontend term of the UI / Server / State architecture
  and the Agent Skill that encodes it, for frontend developers who lost their jobs to AI, and earn from it.'
researched: '2026-10-17'
by: claude code
material_root: .benzene/material
competitors:
- name: GreatFrontEnd
  behind: Yangshun Tay (founder, CEO; ex-Staff Engineer, Meta); Codeney Pte Ltd, Singapore
  url: https://www.greatfrontend.com/
  since: 2022 (GitHub org 2022-08-06; paid product live 2022-10-02)
- name: Master.dev (Frontend Masters)
  behind: Marc Grabanski, founder and CEO; 100% bootstrapped
  url: https://master.dev/
  since: 2014 (renamed Master.dev on 2026-06-15)
- name: BigFrontEnd.dev
  behind: jser合同会社 (JSer LLC), Shibuya, Tokyo
  url: https://bigfrontend.dev/
  since: mid-2020 (earliest question created 2020-07-19)
- name: Frontend Mentor
  behind: Matt Studdert (founder) and Mike Hayden (co-founder, CTO), London
  url: https://www.frontendmentor.io/
  since: '2018'
- name: Scrimba
  behind: Per Harald Borgen (CEO) and Sindre Aarsæther (CTO); Scrimba AS, Oslo; YC S20
  url: https://scrimba.com/
  since: 2016-11 (Scrimba AS incorporated)
- name: Flavio Copes
  behind: Flavio Copes, solo and bootstrapped
  url: https://flaviocopes.com/courses/
  since: 2012 (blog); bootcamp cohorts every year since 2020
- name: Epic Web (Kent C. Dodds)
  behind: Kent C. Dodds, with a production team of 8 credited roles
  url: https://www.epicweb.dev/
  since: 2020 (Epic React by Oct 2020; Epic Web workshops Sep-Oct 2023)
- name: Josh W. Comeau
  behind: Josh W. Comeau, solo (ex-Khan Academy)
  url: https://css-for-js.dev/
  since: 2020 (course platform © 2020-present; CSS for JS Devs selling by 2021)
- name: patterns.dev
  behind: Lydia Hallie and Addy Osmani (co-creators)
  url: https://www.patterns.dev/
  since: 2021 (earliest capture 2021-05-31)
- name: roadmap.sh
  behind: Kamran Ahmed
  url: https://roadmap.sh/
  since: 2017 (GitHub repo created 2017-03-15)
- name: Linear
  behind: Linear, the COO's planning tool (a reference for cycles and capacity, not a competitor)
  url: https://linear.app/method/introduction
  since: not stated in the reports
offices:
  cto:
    summary: A static training site that builds clean, keeps links, alt text and share tags intact, ships free courses at
      Flavio Copes' lesson standard and a sandbox-only checkout, over six interchangeable templates and current term docs.
    report: standards/cto.md
    scale:
      cells: 3
      reason: 'three sub-agents: the training site, the template harness, the terminology docs'
    every: 1
    bars:
    - name: site-builds
      statement: '`python3 .benzene/checks/site.py build` runs the Jekyll build of docs/ to completion with no error or Liquid
        exception in its output and produces index.html.'
      target: 'yes: exit 0, 0 build errors, 0 Liquid exceptions, index.html built'
      competitors:
        Flavio Copes: Astro static site (Alpine.js, Pagefind); /courses/ 8,765 B HTML wire
        patterns.dev: Astro v2.7.2 static site on Netlify
        roadmap.sh: built with Astro and deployed on GitHub Pages, the same static constraint as ours
      sources:
      - https://flaviocopes.com/courses/
      - https://www.patterns.dev/
      - https://roadmap.sh/about
      when: heal
      skill: training-site
      check:
        type: command
        name: verify:site-build
        command:
        - python3
        - .benzene/checks/site.py
        - build
        cwd: .
        timeout_s: 900
    - name: site-health
      statement: Every built page outside demos, assets, storybooks, skills and blog drafts has no broken internal link, no
        <img> without alt (unless role=presentation) and exactly one <h1>.
      target: '0 findings: 0 broken links, 0 images without alt, 1 h1 per page'
      competitors:
        Master.dev (Frontend Masters): 77 of 1,337 <img> on /courses/ lack alt; no lang attribute
        BigFrontEnd.dev: 8 of 8 home-page <img> lack alt; no skip link
        Frontend Mentor: skip link 'Skip to content' and <main> on /challenges
        Flavio Copes: skip link plus <main> on /courses/
      sources:
      - https://master.dev/courses/
      - https://bigfrontend.dev/
      - https://www.frontendmentor.io/challenges
      when: heal
      skill: training-site
      check:
        type: command
        name: verify:site-health
        command:
        - python3
        - .benzene/checks/site.py
        - health
        cwd: .
        timeout_s: 900
    - name: no-client-secret
      statement: No tracked or unignored file holds the value of a daemon secret (PAYPAL_SECRET, SUPABASE_SECRET, the API
        keys), and nothing under docs/ or templates/ matches sb_secret_, service_role, sk-or-v1- or lin_api_.
      target: 0 matches
      competitors:
        Epic Web (Kent C. Dodds): checkout forms post to its own server route /api/skill/checkout/stripe
        Josh W. Comeau: loads paddle.js; Paddle is the merchant of record
        roadmap.sh: sells Pro from an Astro site on GitHub Pages
      sources:
      - https://developer.paypal.com/sdk/js/set-up
      - https://supabase.com/docs/guides/functions/secrets
      - https://www.epicweb.dev/full-stack
      when: heal
      skill: training-site
      check:
        type: command
        name: verify:no-secrets
        command:
        - python3
        - .benzene/checks/site.py
        - secrets
        cwd: .
        timeout_s: 900
    - name: free-courses
      statement: docs/_data/courses.yml lists at least 4 free courses (UI, State, Server, Agent Skills), each with at least
        5 lessons, and at least 20 free lessons in all.
      target: '>= 4 courses, >= 5 lessons each, >= 20 free lessons'
      competitors:
        Flavio Copes: 87 free courses, no signup; AI Agent Skills 5 modules, 25 lessons
        Master.dev (Frontend Masters): 5 full courses free with an account, plus a free bootcamp (21 h 6 min)
        Scrimba: 25 free courses; Learn Agentic Coding free, 35 lessons
        Epic Web (Kent C. Dodds): free 'Get Started With React' tutorial, 20 lessons
      sources:
      - https://flaviocopes.com/courses/
      - https://master.dev/free/
      - https://scrimba.com/t/t0ai
      when: heal
      why: Free courses are the top of every competitor's funnel, and Flavio Copes gives away 87 with no signup.
      skill: training-site
      check:
        type: command
        name: verify:courses
        command:
        - python3
        - .benzene/checks/material.py
        - courses
        cwd: .
        timeout_s: 900
    - name: share-ready-seo
      statement: Every built page outside demos, skills, assets and blog drafts (redirects aside) carries a non-empty meta
        description, an absolute https og:image, a twitter:card and a canonical link.
      target: 100% of pages; 0 missing description, og:image, twitter:card or canonical
      competitors:
        GreatFrontEnd: per-question og:image (/api/og?title=...), canonical, twitter:card summary_large_image
        roadmap.sh: dynamic og:image /og/roadmap/frontend plus FAQPage JSON-LD
        patterns.dev: og:image points at http://localhost:3000 (anti-pattern)
        Josh W. Comeau: no canonical on the home page (anti-pattern)
      sources:
      - https://www.greatfrontend.com/questions/javascript/debounce
      - https://roadmap.sh/frontend
      - https://www.patterns.dev/
      when: heal
      why: Every share card and search result is drawn from these tags, and the leaders emit them on every page.
      skill: training-site
      check:
        type: command
        name: verify:seo
        command:
        - python3
        - .benzene/checks/material.py
        - seo
        cwd: .
        timeout_s: 900
    - name: pricing-page-sync
      statement: Every tier in .benzene/material/finance/pricing.md appears in docs/_data/pricing.yml with the same price_usd.
      target: 0 missing tiers, 0 price mismatches (to $0.001)
      competitors:
        roadmap.sh: 'pricing API and /premium page agree: Pro $10/mo, $100/yr'
        GreatFrontEnd: prices rendered from page data (countryCode, conversionFactor, withPPP)
        Master.dev (Frontend Masters): '''300+'' and ''250+ courses'' on the same page (anti-pattern)'
      sources:
      - https://api.roadmap.sh/v1-subscription-pricing
      - https://www.greatfrontend.com/pricing
      - https://master.dev/features/
      when: heal
      why: A price on the site that differs from the CFO's pricing is a promise nobody made.
      skill: training-site
      check:
        type: command
        name: verify:pricing-sync
        command:
        - python3
        - .benzene/checks/material.py
        - pricing-sync
        cwd: .
        timeout_s: 900
    - name: sandbox-checkout
      statement: 'docs/_config.yml sets paypal.env: sandbox and a client_id, the pricing or checkout page loads the PayPal
        SDK from PayPal (never vendored under docs/), and no live PayPal host is referenced before finance/go-live.md exists.'
      target: 'yes: sandbox env and client_id, SDK loaded from paypal.com, 0 vendored SDK files, 0 live-host references'
      competitors:
        Master.dev (Frontend Masters): accepts PayPal beside Stripe cards and the App Store
        Frontend Mentor: card, PayPal and Google Pay through Chargebee
        Josh W. Comeau: Paddle checkout with PayPal accepted
        Epic Web (Kent C. Dodds): Stripe only; 'No' to PayPal
      sources:
      - https://developer.paypal.com/sdk/js/v5/configuration/
      - https://master.dev/faq/join/
      - https://www.frontendmentor.io/pro
      when: heal
      why: Payments are proven in PayPal's sandbox, with the SDK loaded the way PayPal requires, before any live money can
        move.
      skill: training-site
      check:
        type: command
        name: verify:checkout
        command:
        - python3
        - .benzene/checks/material.py
        - checkout
        cwd: .
        timeout_s: 900
    - name: learner-journey
      statement: In a real browser a learner opens the dashboard and the courses, marks a lesson complete and reaches pricing,
        with no console error and no horizontal scroll at 375 px wide.
      target: 'yes: 4 of 4 steps pass, 0 console errors, 0 px horizontal overflow at 375 px'
      competitors:
        GreatFrontEnd: '''No signup required'': home, question, run; but tests are ''not supported on mobile devices'''
        roadmap.sh: 1 click to full content, no login
        Flavio Copes: '''Mark lesson complete'' and ''Next lesson'' on every lesson, no signup'
        Frontend Mentor: GitHub login, local build, then submit (anti-example)
      sources:
      - https://www.greatfrontend.com/questions/javascript/debounce
      - https://roadmap.sh/frontend
      - https://flaviocopes.com/courses/javascript/arrow-functions/
      when: heal
      why: The competitors that win get a learner to a first lesson in one or two clicks with no signup, on a phone as well
        as a desktop.
      skill: training-site
      check:
        type: command
        name: verify:learner-journey
        command:
        - node
        - .benzene/checks/functional.mjs
        cwd: .
        timeout_s: 900
    - name: template-integrity
      statement: Every template under templates/ has src/**/ui/{atoms,molecules,organisms,templates,skeletons} and a containers
        folder, and each layer holds the same todo-app parts as the other templates.
      target: 0 layout or consistency findings across all templates
      competitors:
        GreatFrontEnd: 'all 59 UI questions in 5 variants: React, Vanilla, Angular, Vue, Svelte'
        Epic Web (Kent C. Dodds): epicshop exercises share one problem / solution folder layout with a Diff tab
        patterns.dev: 53 patterns across vanilla (27), React (15) and Vue (11)
      sources:
      - https://www.greatfrontend.com/questions
      - https://github.com/epicweb-dev/epicshop
      - https://www.patterns.dev/vanilla/singleton-pattern
      when: heal
      skill: template-harness
      check:
        type: command
        name: verify:template-integrity
        command:
        - python3
        - .benzene/checks/templates.py
        - integrity
        cwd: .
        timeout_s: 900
    - name: template-agents-config
      statement: Every template's AGENTS.md has Architecture, Skills, Commands and 'Build a todo app' sections, names at least
        8 existing skills/<name> folders and says how to run its build and test scripts.
      target: 4 of 4 sections, >= 8 known skills, 0 unknown skills, build and test commands named
      competitors:
        Frontend Mentor: AGENTS.md and CLAUDE.md in every challenge, for Claude Code, Cursor and Copilot
        Epic Web (Kent C. Dodds): 30-line AGENTS.md linking docs/agents/*; skills-lock.json pins ship-pr by hash
        patterns.dev: 58 skills installed with npx skills add PatternsDev/skills/react
        Scrimba: '''Multiple AGENTS.md files'' and ''Skills Challenge'' lessons'
      sources:
      - https://www.frontendmentor.io/articles/agents-md-files-in-every-challenge
      - https://github.com/kentcdodds/kentcdodds.com
      - https://github.com/PatternsDev/skills
      when: heal
      skill: template-harness
      check:
        type: command
        name: verify:template-agents
        command:
        - python3
        - .benzene/checks/templates.py
        - agents
        cwd: .
        timeout_s: 900
    - name: todo-app-stability
      statement: elegant-opencode's 'build a todo app', run 25 times on this repository's skills/, finishes with 0 failures
        and the same file-tree hash on every run.
      target: 25 runs, 0 failures, 1 tree hash
      competitors:
        Master.dev (Frontend Masters): 'nearest only: ''Harness Engineering & Agent Orchestration'' video course (2026-07-01),
          no graded agent run'
        Frontend Mentor: 'nearest only: AI code review on 7 dimensions, scored out of 10, per submission'
      sources:
