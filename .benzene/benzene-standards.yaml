showcase:
  kind: site
  what: 'The training site itself: the dashboard, the free courses and the practice bank, every lesson a term with its downloadable
    Agent Skill, built from this repository by Jekyll.'
  build:
  - python3
  - .benzene/checks/site.py
  - build
  - --out
  - docs/_site
  index: docs/_site/index.html
  must_use:
  - /courses/
  - /practice/
  pages:
  - docs/_site/dashboard/index.html
  - docs/_site/courses/index.html
  skill: training-site
  fresh: true
audience:
  metric: combined_audience
  at_least: 5000
  why: 'Feedback steers the roadmap at 30 distinct people giving substantive feedback in a rolling 30-day window, or at 5,000
    combined audience, whichever comes first: Josh W. Comeau shaped CSS for JS Devs with about 30 testers, and Scrimba took
    nine months to reach 5,000 users before its next launch tripled it. Below the threshold every item is still logged and
    answered, and the roadmap follows the competitor bar, not individual requests.'
