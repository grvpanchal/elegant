        command:
        - python3
        - .benzene/checks/material.py
        - roadmap
        cwd: .
        timeout_s: 900
    - name: changelog-monthly
      statement: CHANGELOG.md has dated `## YYYY-MM-DD` entries, the newest at most 31 days old, no raw commit hashes, and
        at least one link to a shipped page (/practice/, /courses/, /skills/ ...).
