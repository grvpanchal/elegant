        - python3
        - .benzene/checks/templates.py
        - stability
        - '25'
        cwd: .
        timeout_s: 900
    - name: terminology-docs-current
      statement: Every term in docs/_data/topics/{ui,server,state}.csv has a doc with title, layout, slug and a reviewed date
        at most 120 days old, the six shared sections, at least 2 reference links (one dated 2025 or later) and its skills/<layer>-<slug>/SKILL.md.
      target: 100% of terms; 0 missing, stale, sectionless, under-referenced or skill-less docs
      competitors:
        patterns.dev: '53 pattern pages; HN: ''reads like its 2017 ... breadth but no depth'''
        roadmap.sh: 120 learnable frontend nodes; Claude Code roadmap added 2026-02-10
        Flavio Copes: '''All 87 free courses rewritten'' (changelog)'
        Josh W. Comeau: '''The most recent significant update was in December 2025'''
      sources:
