# The CTO office of the elegant organisation (benzene-org.yaml beside this file): three sub-agents, one cell per
# skill (cell_per_skill in the organisation file), each held to the bars its skill owns in benzene-standards.yaml.
#
#   training-site      the learner experience under docs/: dashboard, free courses, practice, login, pricing, checkout
#   template-harness   the elegant skills + every template's AGENTS.md + the integrity check; "build a todo app" stable
#   docs-maintainer    the terminology docs, complete and current, each backed by its Agent Skill
#
# Every CTO run is built in its own git worktree (heartbeat.worktree): beta against the workspace, then the CEO's
# final approval merges it. Nothing is pushed by the organisation.
name: elegant-cto
description: CTO office — build and keep the Elegant Frontend AI Harness training site, its templates and its docs to the standard
system: |
  You are a cell of the CTO office of the elegant organisation. Its purpose: the best Frontend AI Harness training site
  (https://elegantfrontend.training), where every lesson is a frontend term of the UI / Server / State architecture and
  the Agent Skill that encodes it, for frontend developers who lost their jobs to AI.

  The repository: docs/ is the Jekyll site; templates/ holds seven interchangeable front-end templates over one atomic
  architecture; skills/ holds the Agent Skills, one per term; .benzene/ is the organisation itself (its standard, its
  skills, its checks under .benzene/checks/, the offices' material). You work in a git worktree of it: your change is
  reviewed, beta-tested and approved before it lands, so make it complete and small.

  Work like an operator: read the failing check's exact output, list and read the files it names, change only what the
  finding needs, write each file with write_workspace_file, then say which files changed and why. Never invent a path, a
  script, a price, a URL or a number; never write a secret into a file; never touch .benzene/ (the organisation's record)
  unless the instruction names a file there.
capability: Build and maintain the Elegant training site, its templates and its terminology docs to the researched standard
skills: [training-site, template-harness, docs-maintainer]
tools: [list_workspace_files, read_workspace_file, write_workspace_file, fetch_url]

# Every CTO role runs on OpenCode Go first (a $10 monthly subscription, the CEO's of 2026-10-21; its key OPENCODE_API_KEY
# is in .env), then on a free OpenRouter model, and last on the local machines: the CEO's order of 2026-10-21, after none
# of the CTO's 24 tasks of 2026-10-20 and 21 passed on the local models alone. Every Go model has its own monthly
# allowance (a 5-hour window holds a fifth of it, a week half), so each kind of work has a model of its own, chosen on
# 2026-10-21 by a structured tool call, a JSON-schema answer and, for the writers, one LinkedIn brief:
#   the templates and the harness   Kimi K2.7 Code ($60 a month, ~1,350 requests a 5-hour window, ~40 tokens a second)
#   the training site               GLM-5.2 ($60, ~880, ~100 a second)
#   the docs and any writer         Qwen3.7 Plus ($60, ~4,300)
#   the judge                       Hy3 ($60, ~4,300, ~100 a second): Tencent's, of another family than every writer here
#   the router and the scout        MiMo V2.6 Flash ($60, ~30,100): the small structured calls
#   the evolver                     Kimi K3 ($15, ~110), then GLM-5.3 and Qwen3.8 Max ($15 each): stronger than the work
#                                   it repairs, and rarely called
# A model out of its window falls back to another Go model, then to a free OpenRouter one (Poolside Laguna for code,
# NVIDIA Nemotron for the rest; the account's free day is 1000 requests), then to the local ones: the P40's Gemma 4
# 26B-A4B (llama-server on 127.0.0.1:1236, unit gemma-local, its key BONSAI_API_KEY), .212's Gemma 4 12B (LM Studio,
# 150k shared by four slots), the LAN Gemma 12B on .152 and .198's Gemma E2B. The subscription is a flat fee with no
# extra usage, so its price here is 0; 64k a session keeps each request's reading cheap, and a longer task runs as a
# chain. Go asks its clients for their own user agent and one x-opencode-session a conversation (benzene-agent #98).
# One slot pool serves every Go model of the organisation (the provider keys it by endpoint) and a session holds its
# slot to its end, so 8 slots, the same in benzene-org.yaml: a route never waits behind three sessions. Kimi K2.7 Code
# takes temperature 1 only. The decider stays Jev on OpenRouter: its decisions endpoint takes no chat model.
x-go: &go {provider: openai_compatible, base_url: "https://opencode.ai/inference/go/openai/v1", api_key_env: OPENCODE_API_KEY, headers: {x-opencode-session: "{session}"}, concurrency: 8, context_tokens: 64000, max_tokens: 16000, timeout_s: 600, price_per_mtok: [0, 0]}
x-or-code: &or_code {provider: openrouter, id: poolside/laguna-s-2.1:free, api_key_env: OPENROUTER_API_KEY, context_tokens: 64000, max_tokens: 16000, timeout_s: 360, price_per_mtok: [0, 0]}
x-or-write: &or_write {provider: openrouter, id: nvidia/nemotron-3.5-super-vl:free, api_key_env: OPENROUTER_API_KEY, context_tokens: 64000, max_tokens: 16000, timeout_s: 360, effort: low, price_per_mtok: [0, 0]}
x-or-small: &or_small {provider: openrouter, id: nvidia/nemotron-3-super-120b-a12b:free, api_key_env: OPENROUTER_API_KEY, max_tokens: 3000, timeout_s: 120, effort: low, price_per_mtok: [0, 0]}
x-or-evolve: &or_evolve {provider: openrouter, id: nvidia/nemotron-3-ultra-550b-a55b:free, api_key_env: OPENROUTER_API_KEY, max_tokens: 8000, timeout_s: 240, effort: low, price_per_mtok: [0, 0]}
x-p40: &p40 {provider: llamacpp, base_url: "http://127.0.0.1:1236/v1", id: gemma-4-26b-a4b-qat, api_key_env: BONSAI_API_KEY, concurrency: 2, context_tokens: 109000, max_tokens: 16000, timeout_s: 600, price_per_mtok: [0, 0]}
x-212: &lan212 {provider: lmstudio, base_url: "http://192.168.1.212:1234/v1", id: google/gemma-4-12b, concurrency: 2, context_tokens: 64000, max_tokens: 8000, timeout_s: 1500, price_per_mtok: [0, 0]}
x-152: &lan152 {provider: lmstudio, base_url: "http://192.168.1.152:1234/v1", id: google/gemma-4-12b, concurrency: 2, context_tokens: 24000, max_tokens: 8000, timeout_s: 600, price_per_mtok: [0, 0]}
x-152-quick: &lan152_quick {<<: *lan152, max_tokens: 3000, timeout_s: 300, extra_body: {reasoning_effort: none}}   # thinking off: a route in 2-4 s
x-198: &lan198 {provider: lmstudio, base_url: "http://192.168.1.198:1234/v1", id: google/gemma-4-e2b, concurrency: 1, context_tokens: 30000, max_tokens: 3000, timeout_s: 300, price_per_mtok: [0, 0]}
models:
  # the templates and the harness (and any skill no spec below names)
  - {<<: *go, role: primary, id: kimi-k2.7-code, temperature: 1.0, fallback_models: [{<<: *go, id: glm-5.2}, *or_code, *p40, *lan152]}
  - {<<: *go, role: coder, id: kimi-k2.7-code, temperature: 1.0, fallback_models: [{<<: *go, id: glm-5.2}, *or_code, *p40, *lan152]}
  - {<<: *go, role: writer, id: qwen3.7-plus, temperature: 0.4, fallback_models: [{<<: *go, id: glm-5.3-flash}, *or_write, *p40, *lan152]}
  # the training site and every facet split from it: every one is a one-stage coder cluster, so it needs a coder spec too
  - {<<: *go, role: primary, skills: [training-site], id: glm-5.2, temperature: 0.2, fallback_models: [{<<: *go, id: kimi-k2.7-code, temperature: 1.0}, *or_code, *lan212, *p40]}
  - {<<: *go, role: coder, skills: [training-site], id: glm-5.2, temperature: 0.2, fallback_models: [{<<: *go, id: kimi-k2.7-code, temperature: 1.0}, *or_code, *lan212, *p40]}
  # the terminology docs: every docs facet is a one-stage writer cluster
  - {<<: *go, role: primary, skills: [docs-maintainer], id: qwen3.7-plus, temperature: 0.3, fallback_models: [{<<: *go, id: glm-5.3-flash}, *or_write, *lan212, *p40]}
  - {<<: *go, role: writer, skills: [docs-maintainer], id: qwen3.7-plus, temperature: 0.4, fallback_models: [{<<: *go, id: glm-5.3-flash}, *or_write, *lan212, *p40]}
  - {<<: *go, role: judge, id: hy3, max_tokens: 4000, temperature: 0, timeout_s: 180,
     fallback_models: [{<<: *go, id: mimo-v2.6-flash, max_tokens: 4000, timeout_s: 180}, *or_small, {<<: *lan152, max_tokens: 6000}]}
  - {<<: *go, role: router, id: mimo-v2.6-flash, max_tokens: 4000, temperature: 0, timeout_s: 120,
     fallback_models: [{<<: *go, id: glm-5.3-flash, max_tokens: 4000, timeout_s: 120}, *or_small, *lan152_quick, *lan198]}
  - {<<: *go, role: scout, id: mimo-v2.6-flash, max_tokens: 4000, timeout_s: 180,
     fallback_models: [{<<: *go, id: glm-5.3-flash, max_tokens: 4000, timeout_s: 180}, {<<: *or_code, max_tokens: 3000, timeout_s: 120}, {<<: *lan152, max_tokens: 6000}, *lan198]}
  - role: decider                      # TypeSafe Jev: routing among the sub-agents and the not-ai-slop gates
    provider: openrouter
    id: jev-latest
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 60
    price_per_mtok: [0.042, 0.0]
  - {<<: *go, role: evolver, id: kimi-k3,
     fallback_models: [{<<: *go, id: glm-5.3}, {<<: *go, id: qwen3.8-max}, *or_evolve, *p40, {<<: *lan152, max_tokens: 6000}]}

guardrail:
  min_chars: 20
  max_chars: 16000
  forbidden_patterns: ["as an ai language model"]
  verifier_fail_cap: 0.40
  max_cost_usd: 0.60
  value_usd: 0.10
  max_latency_s: 3600                 # a local 27B at ~18 tokens a second on the P40, thinking first
  judge_weight: 0.4
  pass_threshold: 0.70
  require_written_files: true

homeostasis:
  divide_below: 0.55
  evolve_below: 0.75
  heal_max_attempts: 2
  min_tasks_before_divide: 3
  mature_after_verified_tasks: 1
  repair_skill_on_failure: true

