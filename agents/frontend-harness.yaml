# The CTO office of the frontend-harness organisation (agents/organisation.yaml):
# the cluster that builds the product. One purpose lives in the organisation
# file; this genome is the one office written by hand, because its verifiers
# are not an opinion — they are the site's own checker, harness/check_harness.py,
# which measures every capability in harness/capabilities.yml against
# greatfrontend.com parity plus the axis that is ours: every unit of practice is
# also an Agent Skill with its own eval.
#
# THE CELL NEVER NEEDS A HUMAN. There is no `strategy:` block, so this lineage
# stays in the heal stage for good: its standard is the site's own checker and
# nothing else. That is only honest because the checker covers *function* as
# well as form — harness/functional/run.mjs drives a real Chromium against the
# built site. Those were the capabilities that used to need someone to click
# them, which was the only reason the life system was ever in the loop here.
#
# Growth has a queue, not just a direction. The site declares `frontier`
# capabilities — parity targets it does not have yet — as measured, failing,
# `required: false` checks; `--next` hands them out one at a time once
# everything required is green. `build-capability` is the skill that closes
# them; `fix-functional` is for something that worked and broke.
#
# Two verifiers, two jobs:
#   verify:capabilities  the site-wide target. `--next` prints the single
#                        highest-priority deficit, so bza discovers *one*
#                        instruction rather than a wall of them. required:false
#                        because no single contribution can close a volume
#                        target and a cell must not be scored down for that.
#   verify:contribution  what the cell just wrote, scoped with --changed to the
#                        files of this task. required:true — this is the loop
#                        that closes, and its output is the correction message.
#
# Once this office has one verified build it is `healed`, and that founds the
# COO: from then on human instructions arrive as a plan the COO dispatches
# across the offices, and discovered work still comes here.
name: frontend-harness
description: CTO office — build and keep the Frontend AI Harness training site green against its capability guardrail
system: |
  You are a Benzene cell whose base purpose is to grow and maintain a frontend
  training site that lives in the workspace. The site is Jekyll: `docs/` is the
  site, `skills/` holds Agent Skills, and `harness/capabilities.yml` is the
  written contract every page is measured against.

  Everything about your work is measured by scripts before anyone reads it:
  front matter schemas, link resolution, word counts, and — for a coding
  question — the question's own tests run under Node. Be exact. Read a file
  before you edit it, write it back whole, and never invent a path, a slug or
  a topic name: `list_workspace_files` is cheap and guessing is not.

  Follow the active skill's procedure and answer format precisely.
capability: Author and maintain measured training content for the Universal Frontend Architecture
efficacy: 1.0

skills: [author-question, author-plan, author-playbook, author-blog, fix-site-health, fix-functional, build-capability]
tools: [list_workspace_files, read_workspace_file, write_workspace_file]

# Model roster, measured on OpenRouter before it was written — "cheap" and
# "famous" are claims, and the prices and behaviour below are observations.
#
# The free tier got the bank built and stalled on the frontier: hard
# implementation work (a framework runtime in the playground) is where a free
# model's ceiling binds rather than the harness. So the roster is now the
# cheapest well-known PAID models that are an actual step up, with the free
# models kept as the last fallback so an outage degrades rather than stops.
#
# Blended $/Mtok at roughly this workload's 3:1 input:output ratio, and the
# smoke test each one passed (write an ES module, reply with code only):
#
#   deepseek/deepseek-v4-flash-0731 0.075  3.2s  correct   <- primary
#   openai/gpt-oss-120b            0.070   1.5s  correct
#   openai/gpt-oss-20b             0.055   1.3s  correct   <- judge
#   mistralai/mistral-nemo         0.022   1.4s  correct   <- router (cheapest famous)
#   qwen/qwen3.7-flash             0.055  11.0s  EMPTY content — reasoning ate the
#                                                budget, so it is not in the roster
#
# gpt-oss-120b was primary first and did not work out. Given tools it returns
# tool calls and nothing else, indefinitely — it kept calling tools with no
# `tools` in the body at all — so a task cost $0.0128 and produced no answer.
# DeepSeek was the only model in the probe that returned content AND tool calls,
# and only with `effort: low`; at medium or above it behaves like the others.
# That setting had no route to an OpenAI-compatible provider until now, which is
# why the roster could not express what the measurement showed.
#
# price_per_mtok is now real, which makes max_cost_usd a real gate for the
# first time: at these prices a task costs around $0.003, so the 0.25 ceiling
# catches a runaway heal loop rather than sitting unreachable at zero.
models:
  - role: primary
    provider: openrouter
    id: deepseek/deepseek-v4-flash-0731
    effort: low                # the setting that makes it answer as well as call tools
    fallback_ids:
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
      - nvidia/nemotron-3-super-120b-a12b:free
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 12000
    temperature: 0.3
    timeout_s: 240
    price_per_mtok: [0.040, 0.080]   # live OpenRouter price (was 0.060/0.120)
  - role: judge
    provider: openrouter
    id: openai/gpt-oss-20b
    effort: low                # judging a rubric is not a reasoning problem
    fallback_ids: [mistralai/mistral-nemo, cohere/north-mini-code:free]
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 3000
    temperature: 0
    timeout_s: 120
    price_per_mtok: [0.030, 0.130]
  - role: router
    provider: openrouter
    id: mistralai/mistral-nemo
    effort: low                # routing is a one-word classification
    fallback_ids: [openai/gpt-oss-20b, inclusionai/ling-3.0-flash-vl:free]
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 1500
    timeout_s: 90
    price_per_mtok: [0.019, 0.030]
  - role: decider              # TypeSafe Jev: routing as a constrained typed choice
    provider: openrouter       # answers at /api/alpha/decisions, not chat — cannot pick an
    id: typesafe/jev-1.13      # off-list skill, returns a calibrated confidence, output billed at $0.
    api_key_env: OPENROUTER_API_KEY   # select_workflow uses it for the choice and falls back to
    timeout_s: 60                     # the router (which still writes the orchestration plan) on any error.
    price_per_mtok: [0.042, 0.0]
  - role: evolver
    provider: openrouter
    id: deepseek/deepseek-v4-flash-0731
    effort: low
    fallback_ids: [openai/gpt-oss-120b, openai/gpt-oss-20b]
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 8000
    timeout_s: 240
    price_per_mtok: [0.040, 0.080]   # live OpenRouter price (was 0.060/0.120)

hooks:
  - event: on_divide
    handler: log_event
  - event: on_evolve
    handler: log_event
  - event: on_apoptosis
    handler: log_event

feedbacks: []

guardrail:
  min_chars: 40
  max_chars: 16000
  forbidden_patterns: ["as an ai language model", "I cannot help with that"]
  verifiers:
    - type: command
      name: verify:capabilities
      command: [python3, harness/check_harness.py, --sync, --next]
      cwd: "."
      required: false
      skip_if_untouched: false
      timeout_s: 900
    - type: command
      name: verify:contribution
      # --failures-only matters more than it looks: this output becomes the
      # correction message, and an agent acts on the first thing it reads.
      # Two defects under forty "pass" lines get answered by writing a new file.
      # --scope incremental includes the functional group, so this one command
      # builds the site and drives a browser over it. It costs ~10s and it is
      # what makes the loop autonomous: form and function in one exit code.
      command: [python3, harness/check_harness.py, --sync, --scope, incremental, --failures-only, --changed, "{touched}"]
      cwd: "."
      required: true
      timeout_s: 900
  verifier_fail_cap: 0.40
  max_cost_usd: 0.25
  max_latency_s: 1800
  judge_rubric: |
    1. The answer reports exactly which files were written, and nothing else was touched.
    2. Nothing was invented: every slug, topic, skill name and link target came from the workspace.
    3. The answer follows the active skill's answer format and ends with a Confidence line.
    4. Prose explains the reasoning, not just the result.
  judge_weight: 0.3
  pass_threshold: 0.70

homeostasis:
  divide_below: 0.66
  evolve_below: 0.80
  apoptosis_below: 0.33
  heal_max_attempts: 2
  ema_alpha: 0.30
  min_tasks_before_divide: 3
  daughter_efficacy: 0.85
  evolve_after_negative_feedback: 2
  negative_feedback_below: 0.5
  evolution_cooldown_tasks: 3
  feedback_requires_verification: true
  autophagy_below: 0.80
  renew_below: 0.50
  max_renewals: 2
  max_regenerations: 2
  mature_after_verified_tasks: 1      # one verified build heals the office and founds the COO
  develop_skill_after_orphans: 3
