<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Clearance around the arrow shaft: the rings break where the arrow crosses them. -->
    <mask id="shaft-gap">
      <rect width="256" height="256" fill="#fff"/>
      <line x1="92" y1="161.5" x2="174" y2="79.5" stroke="#000" stroke-width="55.5" stroke-linecap="square"/>
    </mask>
    <!-- The upper ring also yields to the lower ring's hole where they overlap. -->
    <mask id="upper-ring">
      <rect width="256" height="256" fill="#fff"/>
      <line x1="92" y1="161.5" x2="174" y2="79.5" stroke="#000" stroke-width="55.5" stroke-linecap="square"/>
      <circle cx="91.45" cy="161.85" r="63.7" fill="#000"/>
    </mask>
  </defs>
  <g fill="none" stroke="#202028">
    <circle cx="164.75" cy="88.65" r="73.075" stroke-width="18.65" mask="url(#upper-ring)"/>
    <circle cx="91.45" cy="161.85" r="73.1" stroke-width="18.8" mask="url(#shaft-gap)"/>
  </g>
  <g fill="none" stroke="#ff8850" stroke-width="18.5" stroke-linecap="butt">
    <line x1="92" y1="161.5" x2="174" y2="79.5"/>
    <path d="M137.5 70.25H183V116" stroke-linejoin="miter"/>
  </g>
</svg>
