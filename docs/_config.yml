theme: jekyll-theme-cayman

title: Elegant
markdown: kramdown
highlighter: rouge
author:
  name:       Gaurav Panchal
  url:        https://elegantfrontend.training

url: "https://elegantfrontend.training"
baseurl: "/"

# GitHub repo the Agent Skills are published from — used to build the
# `npx skills add <repo> --skill <slug>` command in the skill alert.
skills_repo: "grvpanchal/elegant"
google_analytics: "G-R8YKPS191K"

plugins:
  - jekyll-sitemap

# The share card a page shows on LinkedIn, X and in search when it names no
# `image` of its own: jekyll-seo-tag writes og:image and twitter:image from it.
# A page's description, when it has none, comes from its own words
# (_plugins/page_descriptions.rb).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png

# Identity provider for docs/account/. The publishable key is designed to ship
# in client code and is safe here ONLY because row-level security is on in the
# project — the key alone reaches no rows, a verified sign-in does. Leave both
# blank in a fork with no project and the site falls back to device profiles.
supabase:
  url: https://ftknnfapxtqqyolggkpc.supabase.co
  anon_key: sb_publishable_wBAMBBfjDfyKxomO-SJcxQ_hx4HfLMk

# Whether docs/pricing/ is on the site. Off until the CFO office sets real
# prices: the nav, the home page and the dashboard link it only when this is
# true, and the page itself carries `published: false` while it is off, so
# turn both on together.
pricing_live: false

# PayPal checkout for docs/pricing/. SANDBOX ONLY. The client id is a public
# identifier — like the Supabase publishable key it is designed to ship in
# client code. There is no PayPal secret anywhere in this site and there must
# never be one: orders are created and captured in the browser against the
# sandbox, and verifying a capture server-side is the CFO office's job.
# pricing.js refuses to load checkout unless env is "sandbox".
paypal:
  env: sandbox
  client_id: AV7FtZs2GbdQIJO920_zIk8yeHuT8B7n4tLBBrbnEDx2RMIfM3nFXAc4TKvI7s12VPi5eCx9B0iJZqJp
  currency: USD
